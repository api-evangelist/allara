name: Allara
description: 'Allara Health is a virtual women''s healthcare platform focused on complex hormonal,
  metabolic, and gynecological conditions such as PCOS, insulin resistance, endometriosis, thyroid
  disorders, menopause, and PMDD. Serving more than 85,000 patients across 45 states and D.C., Allara
  connects members with board-certified OB-GYNs, endocrinologists, women''s health nurse practitioners,
  and registered dietitians for virtual consultations, advanced hormonal and metabolic lab testing,
  personalized treatment plans, and ongoing care coordination. The company operates consumer-facing web
  and patient portal applications; it publishes no public developer API, SDK, or documentation surface
  at this time. Added to the API Evangelist network as an index-ventures portfolio company.'
